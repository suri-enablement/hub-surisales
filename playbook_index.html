<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Playbook Comercial · Suri</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #eef1f8;
    --surface: #ffffff;
    --surface2: #f4f6fc;
    --border: #dde3f0;
    --navy: #0f1e3d;
    --blue: #3d4fd6;
    --blue-light: #eef0fd;
    --green: #00c896;
    --green-light: #e6faf5;
    --gray: #8a96b0;
    --text: #1a2240;
    --text-muted: #64718f;
    --radius: 14px;
    --shadow: 0 2px 12px rgba(15,30,61,0.08);
    --shadow-md: 0 4px 24px rgba(15,30,61,0.12);
    --gold: #ffb703;
    --purple: #7c5cbf;
  }

  body {
    font-family: 'Sora', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── HEADER ── */
  .top-fixed { position: sticky; top: 0; z-index: 200; }
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 1px 8px rgba(15,30,61,0.06);
  }
  .logo img { height: 30px; width: auto; display: block; }
  .header-meta { display: flex; align-items: center; gap: 14px; }
  .header-title { font-size: 15px; font-weight: 700; color: var(--text); }
  .header-sub { font-size: 11.5px; color: var(--text-muted); margin-top: 1px; }
  .btn-back {
    background: var(--surface2);
    color: var(--text-muted);
    border: 1px solid var(--border);
    padding: 7px 16px;
    border-radius: 100px;
    font-family: 'Sora', sans-serif;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn-back:hover { background: var(--border); }

  /* ── SEARCH BAR ── */
  .search-bar-wrap {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 40px;
  }
  .search-input-wrap {
    max-width: 480px;
    margin: 0 auto;
    position: relative;
  }
  .search-input {
    width: 100%;
    padding: 10px 16px 10px 38px;
    border: 1.5px solid var(--border);
    border-radius: 100px;
    font-family: 'Sora', sans-serif;
    font-size: 13px;
    color: var(--text);
    outline: none;
    background: var(--surface2);
    transition: border-color 0.15s, background 0.15s;
  }
  .search-input:focus { border-color: var(--blue); background: var(--surface); }
  .search-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--gray);
    font-size: 13px;
  }

  /* ── LAYOUT ── */
  .page-wrap {
    max-width: 1240px;
    margin: 0 auto;
    padding: 28px 24px 80px;
    display: flex;
    gap: 24px;
    align-items: flex-start;
  }

  /* ── SIDEBAR ── */
  .sidebar {
    width: 280px;
    flex-shrink: 0;
    position: sticky;
    top: 130px;
  }
  .sidebar-card {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 12px;
    max-height: calc(100vh - 160px);
    overflow-y: auto;
  }
  .sidebar-group-label {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.5px;
    color: var(--gray);
    text-transform: uppercase;
    padding: 12px 12px 6px;
  }
  .sidebar-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    border-radius: 9px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    transition: all 0.15s;
    margin-bottom: 2px;
  }
  .sidebar-item:hover { background: var(--surface2); color: var(--text); }
  .sidebar-item.active { background: var(--blue-light); color: var(--blue); }
  .sidebar-item-icon { font-size: 15px; flex-shrink: 0; width: 18px; text-align: center; }
  .sidebar-item-badge {
    margin-left: auto;
    font-size: 8.5px;
    font-weight: 800;
    color: var(--gray);
    background: var(--surface2);
    padding: 2px 6px;
    border-radius: 100px;
  }
  .sidebar-item.active .sidebar-item-badge { background: rgba(61,79,214,0.12); color: var(--blue); }

  /* ── MAIN CONTENT ── */
  main { flex: 1; min-width: 0; }

  .content-section { display: none; }
  .content-section.active { display: block; animation: fadeIn 0.25s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  .section-card {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    margin-bottom: 20px;
  }
  .section-header {
    padding: 26px 30px 20px;
    border-bottom: 1px solid var(--border);
  }
  .section-tag {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.5px;
    color: var(--blue);
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .section-title { font-size: 22px; font-weight: 800; color: var(--text); }
  .section-body { padding: 26px 30px 30px; }

  /* Hero banner */
  .hero-banner { border-radius: var(--radius); overflow: hidden; margin-bottom: 20px; box-shadow: var(--shadow); }
  .hero-banner img { width: 100%; height: auto; display: block; }

  /* Sobre a Suri content */
  .about-lead { font-size: 14.5px; line-height: 1.75; color: var(--text); margin-bottom: 18px; }
  .about-lead + .about-lead { margin-top: -10px; }
  .value-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-top: 22px;
  }
  .value-card {
    background: var(--surface2);
    border-radius: 12px;
    padding: 18px;
    border-left: 3px solid var(--card-color, var(--blue));
  }
  .value-card-title {
    font-size: 12.5px;
    font-weight: 800;
    color: var(--card-color, var(--blue));
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .value-card ul { padding-left: 18px; }
  .value-card li { font-size: 12.5px; color: var(--text); line-height: 1.7; }
  .value-card p { font-size: 12.5px; color: var(--text); line-height: 1.7; }

  .stat-strip {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin: 22px 0;
  }
  .stat-box {
    background: linear-gradient(120deg, #3d4fd6, #00c896);
    border-radius: 12px;
    padding: 18px;
    text-align: center;
    color: #fff;
  }
  .stat-num { font-size: 26px; font-weight: 800; }
  .stat-label { font-size: 10.5px; font-weight: 600; opacity: 0.9; margin-top: 2px; }

  .blog-callout {
    display: flex;
    gap: 14px;
    align-items: center;
    background: var(--navy);
    border-radius: 12px;
    padding: 16px 20px;
    margin-top: 20px;
  }
  .blog-callout-icon { font-size: 22px; flex-shrink: 0; }
  .blog-callout-text { font-size: 12px; color: #c8d0e8; line-height: 1.5; }
  .blog-callout-text a { color: var(--green); font-weight: 700; text-decoration: none; }
  .blog-callout-text a:hover { text-decoration: underline; }

  /* Rituais */
  .ritual-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }
  .ritual-card {
    background: var(--surface2);
    border-radius: 14px;
    padding: 22px;
    border-top: 4px solid var(--card-color, var(--blue));
  }
  .ritual-icon { font-size: 24px; margin-bottom: 10px; }
  .ritual-name { font-size: 14.5px; font-weight: 800; color: var(--text); margin-bottom: 12px; line-height: 1.35; }
  .ritual-meta { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
  .ritual-meta-icon { width: 16px; text-align: center; }

  /* Repository / Trainings list */
  .doc-list { display: flex; flex-direction: column; gap: 8px; }
  .doc-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    background: var(--surface2);
    border-radius: 10px;
    transition: background 0.15s;
  }
  .doc-row.linked { cursor: pointer; }
  .doc-row.linked:hover { background: var(--blue-light); }
  .doc-icon {
    width: 34px; height: 34px;
    border-radius: 9px;
    background: var(--surface);
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
    flex-shrink: 0;
    box-shadow: var(--shadow);
  }
  .doc-info { flex: 1; min-width: 0; }
  .doc-name { font-size: 13px; font-weight: 700; color: var(--text); }
  .doc-status { font-size: 10.5px; color: var(--text-muted); margin-top: 1px; }
  .doc-status.ready { color: var(--green); font-weight: 700; }
  .doc-arrow { color: var(--gray); font-size: 13px; flex-shrink: 0; }

  /* Placeholder pending content */
  .pending-state {
    text-align: center;
    padding: 50px 30px;
  }
  .pending-icon {
    width: 56px; height: 56px;
    border-radius: 16px;
    background: var(--surface2);
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
    margin: 0 auto 16px;
  }
  .pending-title { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
  .pending-desc { font-size: 12.5px; color: var(--text-muted); max-width: 380px; margin: 0 auto; line-height: 1.6; }
  .pending-badge {
    display: inline-block;
    margin-top: 16px;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.4px;
    color: var(--gold);
    background: #fff8e0;
    border: 1px solid #ffe083;
    padding: 4px 12px;
    border-radius: 100px;
  }

  @media (max-width: 900px) {
    .page-wrap { flex-direction: column; }
    .sidebar { width: 100%; position: static; }
    .value-grid, .ritual-grid, .stat-strip { grid-template-columns: 1fr; }
  }
</style>
</head>

  if (!raw) { window.location.href = '../index.html'; return; }
  try {
    const session = JSON.parse(raw);
    const THIRTY_DAYS = 30 * 24 * 60 * 60 * 1000;
    if (!session.ok || (Date.now() - session.ts) > THIRTY_DAYS) {
      localStorage.removeItem('suri_hub_auth');
      window.location.href = '../index.html';
    }
  } catch (e) { window.location.href = '../index.html'; }
})();

let currentSection = 'sobre';

function renderSidebar(filter) {
  const el = document.getElementById('sidebarList');
  const groups = [...new Set(SECTIONS.map(s => s.group))];
  const f = (filter || '').toLowerCase();

  el.innerHTML = groups.map(group => {
    const items = SECTIONS.filter(s => s.group === group && s.title.toLowerCase().includes(f));
    if (items.length === 0) return '';
    return `<div class="sidebar-group-label">${group}</div>` + items.map(s => `
      <div class="sidebar-item ${s.id === currentSection ? 'active' : ''}" onclick="goToSection('${s.id}')">
        <span class="sidebar-item-icon">${s.icon}</span>
        <span>${s.title}</span>
        ${!s.ready ? '<span class="sidebar-item-badge">EM BREVE</span>' : ''}
      </div>
    `).join('');
  }).join('');
}

function filterSidebar(value) {
  renderSidebar(value);
}

function goToSection(id) {
  currentSection = id;
  renderSidebar(document.getElementById('searchInput').value);
  document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
  const target = document.getElementById('section-' + id);
  if (target) target.classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function pendingHTML(section) {
  return `<div class="section-card">
    <div class="section-header">
      <div class="section-tag">${section.group}</div>
      <div class="section-title">${section.icon} ${section.title}</div>
    </div>
    <div class="section-body">
      <div class="pending-state">
        <div class="pending-icon">${section.icon}</div>
        <div class="pending-title">Conteúdo em migração</div>
        <div class="pending-desc">Essa seção ainda está no Notion e será trazida pra cá em breve. Assim que o conteúdo for enviado, ele aparece aqui.</div>
        <div class="pending-badge">AGUARDANDO CONTEÚDO</div>
      </div>
    </div>
  </div>`;
}
