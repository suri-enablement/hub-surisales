<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Guia de Ligação · SDR Suri</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #eef1f8;
    --surface: #ffffff;
    --surface2: #f4f6fc;
    --border: #dde3f0;
    --navy: #0f1e3d;
    --blue: #3d4fd6;
    --blue-light: #eef0fd;
    --green: #00c896;
    --green-light: #e6faf5;
    --gray: #8a96b0;
    --text: #1a2240;
    --text-muted: #64718f;
    --radius: 14px;
    --shadow: 0 2px 12px rgba(15,30,61,0.08);
    --shadow-md: 0 4px 24px rgba(15,30,61,0.12);
    --gold: #ffb703;
  }

  body {
    font-family: 'Sora', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── TOPO FIXO (header + barra de fases) ── */
  .top-fixed {
    position: sticky;
    top: 0;
    z-index: 200;
  }

  /* ── HEADER ── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 1px 8px rgba(15,30,61,0.06);
  }
  .logo img { height: 32px; width: auto; display: block; }
  .header-meta { display: flex; align-items: center; gap: 14px; }
  .header-title { font-size: 15px; font-weight: 600; color: var(--text); }
  .header-sub { font-size: 12px; color: var(--text-muted); margin-top: 1px; }
  .score-pill {
    background: linear-gradient(120deg, #3d4fd6, #00c896);
    color: #fff;
    font-size: 13px;
    font-weight: 800;
    padding: 7px 16px;
    border-radius: 100px;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 6px;
    box-shadow: 0 2px 8px rgba(61,79,214,0.3);
    transition: transform 0.15s;
  }
  .score-pill.bump { transform: scale(1.12); }

  /* ── PROGRESS BAR (navegação âncora entre fases) ── */
  .progress-bar-wrap {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 40px;
  }
  .progress-steps {
    display: flex;
    align-items: stretch;
    overflow-x: auto;
  }
  .step-tab {
    flex: 1;
    min-width: 130px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 12px 8px 14px;
    cursor: pointer;
    border-bottom: 3px solid transparent;
    transition: all 0.2s;
  }
  .step-tab:hover { background: var(--surface2); }
  .step-tab.complete { border-bottom-color: var(--green); }
  .step-num {
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--border);
    color: var(--gray);
    font-size: 11px;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .step-tab.complete .step-num { background: var(--green); color: #fff; }
  .step-label {
    font-size: 10px;
    font-weight: 500;
    color: var(--gray);
    text-align: center;
    line-height: 1.3;
  }
  .step-tab.complete .step-label { color: var(--green); font-weight: 700; }

  /* ── MAIN ── */
  main {
    max-width: 820px;
    margin: 0 auto;
    padding: 28px 20px 100px;
  }

  /* ── FRASE MOTIVACIONAL ── */
  .motivation-banner {
    background: linear-gradient(120deg, #3d4fd6, #00c896);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px 22px;
    margin-bottom: 16px;
    color: #fff;
    text-align: center;
  }
  .motivation-quote {
    font-size: 13.5px;
    font-weight: 700;
    line-height: 1.5;
    font-style: italic;
  }
  .motivation-source {
    font-size: 10px;
    font-weight: 500;
    opacity: 0.85;
    margin-top: 6px;
    letter-spacing: 0.3px;
  }

  /* ── OVERALL SCORE BAR (fixa, dentro do topo sticky) ── */
  .overall-score-wrap {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 40px;
  }
  .overall-score-card {
    max-width: 820px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .overall-score-label { font-size: 12px; font-weight: 600; color: var(--text-muted); white-space: nowrap; }
  .overall-bar-bg { flex: 1; height: 10px; background: var(--surface2); border-radius: 100px; overflow: hidden; }
  .overall-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #3d4fd6, #00c896);
    border-radius: 100px;
    transition: width 0.4s ease;
  }
  .overall-score-num { font-size: 13px; font-weight: 800; color: var(--blue); white-space: nowrap; }

  /* ── FASE CARD (bloco estilo nível de jogo) ── */
  .phase-card {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    margin-bottom: 14px;
    border: 2px solid transparent;
    transition: border-color 0.2s;
  }
  .phase-card.complete { border-color: var(--green); }

  .phase-header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 18px 22px;
    cursor: pointer;
    user-select: none;
  }
  .phase-badge {
    width: 42px; height: 42px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 19px;
    font-weight: 800;
    color: #fff;
    flex-shrink: 0;
    position: relative;
  }
  .phase-badge .phase-check {
    display: none;
    position: absolute;
    top: -6px; right: -6px;
    width: 18px; height: 18px;
    background: var(--green);
    border-radius: 50%;
    border: 2px solid #fff;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    color: #fff;
  }
  .phase-card.complete .phase-badge .phase-check { display: flex; }
  .phase-info { flex: 1; min-width: 0; }
  .phase-name {
    font-size: 15.5px;
    font-weight: 700;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .phase-tag {
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 0.5px;
    color: var(--gray);
    text-transform: uppercase;
    margin-bottom: 2px;
  }
  .phase-progress-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 6px;
  }
  .phase-bar-bg { flex: 1; height: 6px; background: var(--surface2); border-radius: 100px; overflow: hidden; max-width: 240px; }
  .phase-bar-fill { height: 100%; border-radius: 100px; transition: width 0.3s ease; }
  .phase-count { font-size: 10.5px; font-weight: 700; color: var(--gray); white-space: nowrap; }
  .phase-arrow {
    font-size: 13px;
    color: var(--gray);
    transition: transform 0.25s;
    flex-shrink: 0;
  }
  .phase-card.expanded .phase-arrow { transform: rotate(90deg); }
  .phase-weight-badge {
    display: inline-block;
    background: var(--surface2);
    color: var(--text-muted);
    font-size: 10px;
    font-weight: 800;
    padding: 2px 9px;
    border-radius: 100px;
    margin-left: 8px;
    vertical-align: middle;
    white-space: nowrap;
  }

  .phase-body {
    display: none;
    border-top: 1px solid var(--border);
  }
  .phase-card.expanded .phase-body { display: block; }

  /* ── ITEMS ── */
  .item-list { padding: 6px 0; }
  .item {
    display: flex;
    align-items: flex-start;
    gap: 13px;
    padding: 14px 22px;
    border-bottom: 1px solid var(--surface2);
    cursor: pointer;
    transition: background 0.15s;
  }
  .item:last-child { border-bottom: none; }
  .item:hover { background: var(--surface2); }
  .item.checked { background: var(--green-light); }

  .item-checkbox {
    width: 22px; height: 22px;
    border-radius: 7px;
    border: 2px solid var(--border);
    flex-shrink: 0;
    margin-top: 1px;
    display: flex; align-items: center; justify-content: center;
    background: #fff;
    transition: all 0.15s;
  }
  .item.checked .item-checkbox { background: var(--green); border-color: var(--green); }
  .item-check-svg { display: none; }
  .item.checked .item-check-svg { display: block; }

  .item-content { flex: 1; min-width: 0; }
  .item-text {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.45;
    transition: color 0.15s;
  }
  .item.checked .item-text { color: var(--text-muted); text-decoration: line-through; text-decoration-color: #a8c8bd; }

  /* ── INSTRUÇÃO RECOLHIDA ── */
  .instr-toggle {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    margin-top: 7px;
    font-size: 11px;
    font-weight: 600;
    color: var(--blue);
    cursor: pointer;
    padding: 3px 0;
    border: none;
    background: none;
    font-family: inherit;
  }
  .instr-toggle:hover { color: var(--navy); }
  .instr-arrow { transition: transform 0.2s; display: inline-block; }
  .instr-toggle.open .instr-arrow { transform: rotate(90deg); }

  .instr-box {
    display: none;
    margin-top: 8px;
    border-radius: 10px;
    background: var(--navy);
    padding: 12px 16px;
    font-size: 12.5px;
    line-height: 1.6;
    color: #e3e8f7;
  }
  .instr-box.open { display: block; }

  /* ── AVISO CONDICIONAL ── */
  .item-condition {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    margin-top: 5px;
    font-size: 10.5px;
    font-weight: 600;
    color: #b45309;
    background: #fff8e0;
    border: 1px solid #fde68a;
    border-radius: 6px;
    padding: 3px 8px;
  }
  .item-condition::before { content: "⚠️ "; }

  /* ── NÃO SE APLICA (itens condicionais) ── */
  .item-na-toggle {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    margin-top: 6px;
    font-size: 10.5px;
    font-weight: 600;
    color: var(--text-muted);
    cursor: pointer;
    padding: 3px 8px 3px 3px;
    border-radius: 100px;
    background: var(--surface2);
    transition: all 0.15s;
  }
  .item-na-toggle:hover { background: var(--border); }
  .item-na-toggle.active { background: var(--gray); color: #fff; }
  .item-na-box {
    width: 16px; height: 16px;
    border-radius: 5px;
    border: 1.5px solid var(--border);
    background: #fff;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: all 0.15s;
  }
  .item-na-toggle.active .item-na-box { background: rgba(255,255,255,0.25); border-color: transparent; }
  .item-na-svg { display: none; }
  .item-na-toggle.active .item-na-svg { display: block; }
  .item.na { background: var(--surface2); }
  .item.na .item-text { color: var(--text-muted); font-style: italic; }
  .item.na .item-checkbox { border-color: var(--border); opacity: 0.5; }

  /* ── DICA SPIN (não pontua) ── */
  .item-tip {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin-top: 8px;
    font-size: 11px;
    line-height: 1.55;
    color: #4c3d8f;
    background: #f1edff;
    border: 1px solid #ddd4ff;
    border-radius: 8px;
    padding: 8px 10px;
  }
  .item-tip-icon { flex-shrink: 0; font-size: 13px; }
  .item-tip-label {
    font-weight: 800;
    font-size: 9.5px;
    letter-spacing: 0.4px;
    color: #7c5cbf;
    display: block;
    margin-bottom: 2px;
  }

  /* ── OPÇÕES (A / B) ── */
  .option-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid rgba(255,255,255,0.07);
    font-size: 12.5px;
    line-height: 1.6;
    color: #e3e8f7;
  }
  .option-item:last-child { border-bottom: none; padding-bottom: 0; }
  .option-item:first-child { padding-top: 0; }
  .option-letter {
    min-width: 20px; height: 20px;
    border-radius: 50%;
    background: rgba(255,255,255,0.12);
    color: var(--green);
    font-size: 10px;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    margin-top: 2px;
  }

  /* ── BOTÃO FINALIZAR ── */
  .finish-wrap { text-align: center; margin-top: 24px; }
  .btn-finish {
    background: linear-gradient(120deg, #3d4fd6, #00c896);
    color: #fff;
    border: none;
    padding: 14px 36px;
    border-radius: 12px;
    font-family: 'Sora', sans-serif;
    font-size: 14.5px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(61,79,214,0.3);
    transition: transform 0.15s;
  }
  .btn-finish:hover { transform: translateY(-2px); }

  /* ── TELA DE RESULTADO FINAL ── */
  .result-screen { display: none; }
  .result-screen.visible { display: block; }
  .result-card {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow-md);
    padding: 40px 32px;
    text-align: center;
  }
  .result-trophy { font-size: 52px; margin-bottom: 8px; }
  .result-rank { font-size: 13px; font-weight: 800; letter-spacing: 0.5px; text-transform: uppercase; color: var(--blue); margin-bottom: 4px; }
  .result-score { font-size: 46px; font-weight: 800; color: var(--text); line-height: 1; margin-bottom: 4px; }
  .result-score span { font-size: 20px; color: var(--gray); font-weight: 700; }
  .result-message { font-size: 13.5px; color: var(--text-muted); margin-bottom: 26px; }
  .result-breakdown { text-align: left; max-width: 400px; margin: 0 auto 26px; }
  .result-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid var(--surface2);
    font-size: 12.5px;
  }
  .result-row:last-child { border-bottom: none; }
  .result-row-name { font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 8px; }
  .result-row-score { font-weight: 800; color: var(--blue); }
  .result-btns { display: flex; gap: 10px; justify-content: center; }
  .btn-back, .btn-restart {
    border: none;
    padding: 10px 22px;
    border-radius: 9px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Sora', sans-serif;
  }
  .btn-back { background: var(--surface2); color: var(--text-muted); border: 1px solid var(--border); }
  .btn-restart { background: var(--blue-light); color: var(--blue); }
  .btn-restart:hover { background: #dde3fb; }

</style>
</head>

    <div class="motivation-source">Inspirado em SPIN Selling, BANT e técnicas modernas de qualificação</div>
  </div>

  <div id="blocksContainer"></div>

  <div class="finish-wrap" id="finishWrap">
    <button class="btn-finish" onclick="showResult()">🏁 Finalizar ligação e ver pontuação</button>
  </div>

  <div class="result-screen" id="resultScreen">
    <div class="result-card">
      <div class="result-trophy" id="resultTrophy">🏆</div>
      <div class="result-rank" id="resultRank">RESULTADO</div>
      <div class="result-score"><span id="resultScoreNum">0</span><span>%</span></div>
      <div class="result-message" id="resultMessage"></div>
      <div class="result-breakdown" id="resultBreakdown"></div>
      <div class="result-btns">
        <button class="btn-back" onclick="hideResult()">← Voltar ao guia</button>
        <button class="btn-restart" onclick="restart()">↺ Nova ligação</button>
      </div>
    </div>
  </div>
</main>

<script>
// ─────────────────────────────────────────────
// AUTENTICAÇÃO — verifica sessão do HUB (login único compartilhado)
// Se não estiver autenticado ou a sessão tiver expirado, volta pro HUB.
// ─────────────────────────────────────────────
(function checkHubAuth() {
  const raw = localStorage.getItem('suri_hub_auth');
  if (!raw) { window.location.href = '../index.html'; return; }
  try {
    const session = JSON.parse(raw);
    const THIRTY_DAYS = 30 * 24 * 60 * 60 * 1000;
    if (!session.ok || (Date.now() - session.ts) > THIRTY_DAYS) {
      localStorage.removeItem('suri_hub_auth');
      window.location.href = '../index.html';
    }
  } catch (e) {
    window.location.href = '../index.html';
  }
})();

// ─────────────────────────────────────────────
// BLUEPRINT — cada item tem: text (critério) + options (2 alternativas de script)
// tip: dica de técnica que NÃO pontua, só orienta
// condition: aviso de quando o critério se aplica
// ─────────────────────────────────────────────
const BLOCKS = [
  {
    id: 1,
    icon: "🤝",
    title: "Abordagem Inicial e Rapport",
    weight: 15,
    color: "#3d4fd6",
    items: [
      {
        text: "O SDR se apresentou informando seu nome e seu papel na Suri?",
        options: [
          "Me chamo [nome], especialista da Suri.",
          "Oi, aqui é o [nome], sou especialista da Suri."
        ]
      }
    ]
  },
  {
    id: 2,
    icon: "🎯",
    title: "BANT",
    weight: 35,
    color: "#7c5cbf",
    items: [
      {
        text: "O SDR VALIDOU qual a dor principal do lead?",
        tip: "Faça uma pergunta de implicação (SPIN) logo depois que o lead falar sobre a dor — aprofunda o impacto antes de avançar.",
        options: [
          "Você se conectou com a gente, o que te motivou? Qual é o maior gargalo no seu atendimento hoje?",
          "Antes de te contar mais sobre a Suri, me conta: qual é o maior desafio no seu atendimento via WhatsApp?"
        ]
      },
      {
        text: "Falou que a Suri faz parte da TOTVS, a maior empresa de tecnologia do Brasil e que é uma plataforma especializada em IA para vendas e atendimento conversacional?",
        options: [
          "A Suri é uma plataforma especializada em IA para vendas e atendimento conversacional e faz parte da TOTVS, a maior empresa de tecnologia do Brasil.",
          "Somos parte da TOTVS, maior empresa de tecnologia do Brasil, e desenvolvemos IA especializada em vendas e atendimento via WhatsApp."
        ]
      },
      {
        text: "Validou urgência ou interesse em resolver o problema?",
        options: [
          "Isso é algo que vocês querem resolver nos próximos meses ou já está urgente agora?",
          "Você está em fase de pesquisa ou já tem um prazo em mente pra implementar uma solução?"
        ]
      },
      {
        text: "Validou quantos funcionários a empresa possui?",
        options: [
          "Só pra eu entender o tamanho da operação: quantas pessoas trabalham na empresa hoje?",
          "Me fala um pouco do porte da empresa — quantos colaboradores vocês têm?"
        ]
      },
      {
        text: "Validou se há capacidade de investimento mínima de R$ 660,00?",
        condition: "Apenas se quantidade de funcionários for menor que 10",
        options: [
          "Nossos planos começam a partir de R$ 660 por mês. Isso está dentro da faixa de investimento que vocês têm disponível?",
          "Só pra alinhar expectativa: o plano de entrada é R$ 660/mês. Faz sentido pro momento de vocês?"
        ]
      }
    ]
  },
  {
    id: 3,
    icon: "🌐",
    title: "Validação de Requisitos Técnicos",
    weight: 25,
    color: "#3d6fd4",
    items: [
      {
        text: "O SDR validou a situação atual do site do lead e informou ser necessário ter um site?",
        condition: "Apenas se o site não estiver disponível no cadastro",
        options: [
          "Vocês têm um site no ar? Pergunto porque pra ativar o WhatsApp Oficial, a Meta exige um site ativo da empresa.",
          "Só uma validação rápida: vocês têm site? É um requisito obrigatório da Meta pra homologar o número."
        ]
      }
    ]
  },
  {
    id: 4,
    icon: "📅",
    title: "Agendamento e Próximos Passos",
    weight: 15,
    color: "#ffb703",
    textColor: "#1a2240",
    items: [
      {
        text: "O SDR confirmou dia, data e hora da reunião?",
        options: [
          "Então fica confirmado: [dia], [data] às [hora]. Você vai receber o convite agora pelo WhatsApp.",
          "Perfeito, agendado pra [dia] às [hora]. Vou te mandar o link da reunião por WhatsApp já."
        ]
      },
      {
        text: "Confirmou envio do convite por WhatsApp?",
        options: [
          "Vou te mandar o link agora mesmo nesse número. Confirma pra mim que chegou, tá?",
          "O convite vai chegar aí no WhatsApp em instantes. Qualquer coisa é só me chamar nesse mesmo número."
        ]
      }
    ]
  },
  {
    id: 5,
    icon: "🔁",
    title: "Repasse de Contexto ao Closer",
    weight: 10,
    color: "#00c896",
    items: [
      {
        text: "O lead foi contextualizado sobre o que acontecerá na reunião com o closer?",
        options: [
          "Na reunião, o especialista já vai entrar sabendo do seu cenário e vai te mostrar como a Suri resolve isso na prática. Vai ser rápido e direto — uns 30 minutos.",
          "Você vai conversar com um dos nossos especialistas. Ele já vai estar por dentro do que você me contou e vai te mostrar a solução aplicada ao seu negócio."
        ]
      }
    ]
  }
];

// ── STATE ──
let checked = BLOCKS.map(b => new Array(b.items.length).fill(false));
let notApplicable = BLOCKS.map(b => new Array(b.items.length).fill(false));
let expanded = new Array(BLOCKS.length).fill(false);

function totalItems() { return BLOCKS.reduce((s,b) => s + b.items.length, 0); }
function isDone(bi, ii) { return checked[bi][ii] || notApplicable[bi][ii]; }
function blockChecked(bi) { return checked[bi].filter((v,ii) => isDone(bi,ii)).length; }

function weightedScore() {
  let score = 0;
  BLOCKS.forEach((b, bi) => {
    const frac = b.items.length ? blockChecked(bi) / b.items.length : 0;
    score += frac * b.weight;
  });
  return score; // 0-100
}

function render() {
  renderProgressSteps();
  renderBlocks();
  updateScore();
}

function renderProgressSteps() {
  const el = document.getElementById('progressSteps');
  el.innerHTML = BLOCKS.map((b, i) => {
    const complete = blockChecked(i) === b.items.length;
    const cls = complete ? 'complete' : '';
    return `<div class="step-tab ${cls}" onclick="jumpToBlock(${i})">
      <div class="step-num">${complete ? '✓' : (i+1)}</div>
      <div class="step-label">${b.title}</div>
    </div>`;
  }).join('');
}

function renderBlocks() {
  const container = document.getElementById('blocksContainer');

  container.innerHTML = BLOCKS.map((b, bi) => {
    const textColor = b.textColor || '#ffffff';
    const count = blockChecked(bi);
    const total = b.items.length;
    const pct = Math.round((count/total)*100);
    const complete = count === total;

    const itemsHTML = b.items.map((item, ii) => {
      const key = `${bi}-${ii}`;
      const isChecked = checked[bi][ii];
      const isNA = notApplicable[bi][ii];
      const checkedCls = isChecked ? ' checked' : '';
      const naCls = isNA ? ' na' : '';

      const optsHTML = item.options.map((opt, oi) =>
        `<div class="option-item"><span class="option-letter">${String.fromCharCode(65+oi)}</span>${opt}</div>`
      ).join('');

      const tipHTML = item.tip ? `<div class="item-tip">
        <span class="item-tip-icon">💡</span>
        <div><span class="item-tip-label">DICA SPIN — NÃO PONTUA</span>${item.tip}</div>
      </div>` : '';

      const naToggleHTML = item.condition ? `<div class="item-na-toggle${isNA ? ' active' : ''}" onclick="toggleNA(event,${bi},${ii})">
          <div class="item-na-box">
            <svg class="item-na-svg" width="10" height="10" viewBox="0 0 12 12" fill="none"><path d="M2 6h8" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
          </div>
          <span>Não se aplica — contar automaticamente</span>
        </div>` : '';

      return `<div class="item${checkedCls}${naCls}" onclick="toggleCheck(${bi},${ii})">
        <div class="item-checkbox">
          <svg class="item-check-svg" width="12" height="12" viewBox="0 0 12 12" fill="none">
            <path d="M2 6l3 3 5-5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="item-content">
          <div class="item-text">${item.text}</div>
          ${item.condition ? `<div class="item-condition">${item.condition}</div>` : ''}
          ${naToggleHTML}
          ${tipHTML}
          <button class="instr-toggle" onclick="toggleInstr(event,'instr-${key}',this)">
            <span class="instr-arrow">▶</span> ver instrução
          </button>
          <div class="instr-box" id="instr-${key}">${optsHTML}</div>
        </div>
      </div>`;
    }).join('');

    return `<div class="phase-card ${complete ? 'complete' : ''} ${expanded[bi] ? 'expanded' : ''}" id="block-${bi}">
      <div class="phase-header" onclick="togglePhase(${bi})">
        <div class="phase-badge" style="background:${b.color};color:${textColor}">
          ${b.icon}
          <div class="phase-check">✓</div>
        </div>
        <div class="phase-info">
          <div class="phase-tag">Fase ${bi+1}</div>
          <div class="phase-name">${b.title} <span class="phase-weight-badge">${b.weight}%</span></div>
          <div class="phase-progress-row">
            <div class="phase-bar-bg"><div class="phase-bar-fill" style="width:${pct}%;background:${b.color}"></div></div>
            <div class="phase-count">${count}/${total}</div>
          </div>
        </div>
        <div class="phase-arrow">▶</div>
      </div>
      <div class="phase-body">
        <div class="item-list">${itemsHTML}</div>
      </div>
    </div>`;
  }).join('');
}

function togglePhase(bi) {
  expanded[bi] = !expanded[bi];
  render();
}

function jumpToBlock(bi) {
  expanded[bi] = true;
  render();
  setTimeout(() => {
    const el = document.getElementById('block-' + bi);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 50);
}

function toggleCheck(bi, ii) {
  checked[bi][ii] = !checked[bi][ii];
  if (checked[bi][ii]) notApplicable[bi][ii] = false;
  render();
  const pill = document.getElementById('scorePill');
  pill.classList.add('bump');
  setTimeout(() => pill.classList.remove('bump'), 200);
}

function toggleNA(e, bi, ii) {
  e.stopPropagation();
  notApplicable[bi][ii] = !notApplicable[bi][ii];
  if (notApplicable[bi][ii]) checked[bi][ii] = false;
  render();
  const pill = document.getElementById('scorePill');
  pill.classList.add('bump');
  setTimeout(() => pill.classList.remove('bump'), 200);
}

function toggleInstr(e, id, btn) {
  e.stopPropagation();
  const box = document.getElementById(id);
  box.classList.toggle('open');
  btn.classList.toggle('open');
}

function updateScore() {
  const pct = Math.round(weightedScore());
  document.getElementById('scoreText').textContent = `${pct}%`;
  document.getElementById('overallFill').style.width = pct + '%';
  document.getElementById('overallNum').textContent = pct + '%';
}

function showResult() {
  const pct = Math.round(weightedScore());

  let rank, trophy, message;
  if (pct >= 90) { rank = 'Excelente'; trophy = '🏆'; message = 'Ligação completa! Execução no mais alto nível.'; }
  else if (pct >= 70) { rank = 'Muito bem'; trophy = '🥈'; message = 'Ótima condução — só faltaram alguns detalhes.'; }
  else if (pct >= 40) { rank = 'Bom progresso'; trophy = '🥉'; message = 'Vários pontos cumpridos, mas dá pra ir além.'; }
  else { rank = 'Em construção'; trophy = '🚀'; message = 'Ainda no começo — use o guia como apoio na próxima.'; }

  document.getElementById('resultTrophy').textContent = trophy;
  document.getElementById('resultRank').textContent = rank;
  document.getElementById('resultScoreNum').textContent = pct;
  document.getElementById('resultMessage').textContent = message;

  document.getElementById('resultBreakdown').innerHTML = BLOCKS.map((b, bi) => {
    const c = blockChecked(bi);
    const frac = b.items.length ? c / b.items.length : 0;
    const earned = (frac * b.weight).toFixed(1);
    return `<div class="result-row">
      <div class="result-row-name">${b.icon} ${b.title} <span class="phase-weight-badge">${b.weight}%</span></div>
      <div class="result-row-score">${earned} / ${b.weight}</div>
    </div>`;
  }).join('');

  document.getElementById('blocksContainer').style.display = 'none';
  document.getElementById('finishWrap').style.display = 'none';
  document.getElementById('resultScreen').classList.add('visible');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function hideResult() {
  document.getElementById('resultScreen').classList.remove('visible');
  document.getElementById('blocksContainer').style.display = '';
  document.getElementById('finishWrap').style.display = '';
}

function restart() {
  checked = BLOCKS.map(b => new Array(b.items.length).fill(false));
  notApplicable = BLOCKS.map(b => new Array(b.items.length).fill(false));
  expanded = new Array(BLOCKS.length).fill(false);
  hideResult();
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}


render();
</script>
</body>
</html>
